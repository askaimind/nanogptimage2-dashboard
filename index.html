<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  // ---- Auto cache-bust: forces a fresh fetch after every deploy without manual ?v= ----
  // Bump BUILD whenever index.html changes. On load, if the URL's ?v= doesn't match,
  // reload ONCE with ?v=BUILD so the browser pulls the new file. The sessionStorage
  // guard stops this from looping. Result: visitors always land on current code.
  (function(){
    var BUILD = '36.5';
    try {
      var url = new URL(window.location.href);
      var v = url.searchParams.get('v');
      if (v !== BUILD) {
        if (sessionStorage.getItem('nano_reloaded_for') === BUILD) return; // already fresh this session
        sessionStorage.setItem('nano_reloaded_for', BUILD);
        url.searchParams.set('v', BUILD);
        window.location.replace(url.toString());
      }
    } catch(e) { /* if URL API unavailable, fail open - page still works */ }
  })();
  </script>
<meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NanoRunway · Discovery</title>

<link rel="apple-touch-icon" href="favicon.png?v=36.5">
<style>
/* ---------- YouTube-mobile faithful reproduction ----------
   Goal: judge stories in the exact visual context they'll compete in.
   Layout, type scale, and spacing mirror the YouTube Android feed. */
:root{
  --bg:#0f0f0f;            /* YT dark bg */
  --surface:#0f0f0f;
  --chip:#272727;
  --chip-active:#f1f1f1;
  --chip-active-text:#0f0f0f;
  --text:#f1f1f1;
  --text-dim:#aaaaaa;
  --line:#272727;
  --red:#ff0000;
  --green:#FFFFFF;
  --amber:#FFD166;
  --skip:#888;
  --pill:#000c;
  --yt-sans:'Roboto','Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--yt-sans);}
body{max-width:480px;margin:0 auto;padding-bottom:64px;overflow-x:hidden;}

/* ---- Top app bar ---- */
.appbar{position:sticky;top:0;z-index:30;background:var(--bg);
  display:flex;align-items:center;gap:10px;padding:12px 14px 8px;
  flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none;}
.appbar::-webkit-scrollbar{display:none;}
.appbar>*{flex:0 0 auto;}
.yt-logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px;letter-spacing:-.5px;}
.yt-mark{width:30px;height:21px;background:var(--red);border-radius:5px;position:relative;flex:none;}
.yt-mark::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-45%,-50%);
  border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;}
.src-toggles{display:flex;gap:12px;font-size:13px;color:var(--text-dim);margin-left:10px;flex-wrap:nowrap;}
.refresh-btn{margin-left:auto;background:var(--chip);border:none;color:var(--text);
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;}
.refresh-btn:active{background:#3a3a3a;}
.refresh-btn svg{width:18px;height:18px;}
.refresh-btn.spinning svg{animation:spin .8s linear infinite;}
.genthumb-btn{background:var(--chip);border:1px solid rgba(255,255,255,.4);color:var(--green);
  height:34px;padding:0 12px;border-radius:17px;font-size:12px;font-weight:700;
  display:flex;align-items:center;cursor:pointer;flex:none;margin-left:8px;white-space:nowrap;}
.genthumb-btn:active{transform:scale(.97);}
.genthumb-btn:disabled{cursor:default;}
/* v32: the old rule dimmed the button to 60% while it was disabled, which fought the
   `rendering` pulse and made a working button look greyed-out and stuck. Only dim a
   button that is disabled and NOT actively rendering. */
.genthumb-btn:disabled:not(.rendering){opacity:.6;}
.newpill{position:absolute;left:8px;top:8px;background:#fff;color:#0f0f0f;font-size:11px;
  font-weight:800;letter-spacing:.04em;padding:3px 7px;border-radius:5px;z-index:2;}
.genthumb-btn.rendering{border-color:var(--green);color:var(--green);
  animation:genpulse 1.1s ease-in-out infinite;}
@keyframes genpulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,255,255,.0);}
  50%{opacity:.65;box-shadow:0 0 10px 1px rgba(255,255,255,.45);}}
.src-toggles label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;white-space:nowrap;}
.src-toggles input{accent-color:var(--red);width:14px;height:14px;}

/* ---- Category chips ---- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 12px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;background:var(--chip);color:var(--text);border:none;
  padding:8px 14px;border-radius:9px;font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;}
.chip.active{background:var(--chip-active);color:var(--chip-active-text);font-weight:600;}

/* ---- Feed ---- */
.feed{display:flex;flex-direction:column;}
.card{cursor:pointer;}
.thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#1c1c1c;overflow:hidden;}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  color:#555;font-size:13px;text-align:center;padding:0 20px;line-height:1.4;}
.dur{position:absolute;right:8px;bottom:8px;background:var(--pill);color:#fff;
  font-size:12px;font-weight:600;padding:2px 5px;border-radius:5px;}
.meta{display:flex;gap:12px;padding:12px 12px 18px;}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;background:#333;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.meta-text{flex:1;min-width:0;}
.vid-title{font-size:15px;font-weight:600;line-height:1.3;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
/* When the card is expanded, reveal the FULL title (no clamp) so a cut-off
   headline/title never ends abruptly — tapping the card shows the rest. */
.card.open .vid-title{-webkit-line-clamp:unset;display:block;overflow:visible;}
.vid-sub{font-size:13px;color:var(--text-dim);margin-top:4px;line-height:1.35;}
.kebab{flex:none;color:var(--text-dim);font-size:20px;line-height:1;padding:2px 2px 0;}

/* status accent dot on card */
.statusline{height:2px;width:0;background:var(--green);transition:width .3s;}
.card[data-eff="selected"] .statusline{width:100%;background:var(--green);}
.card[data-eff="hold"]     .statusline{width:100%;background:var(--amber);}
.card[data-eff="skip"]     .statusline{width:100%;background:#444;}

/* ---- Expanded detail (tap to open) ---- */
.detail{display:none;background:#1a1a1a;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:16px 14px 20px;}
.card.open .detail{display:block;animation:slide .22s ease;}
@keyframes slide{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.d-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
.reroll-btn{margin-left:auto;font-size:12px;font-weight:700;padding:5px 11px;border-radius:7px;
  border:1px solid rgba(139,180,255,.4);background:rgba(139,180,255,.10);color:#8bb4ff;cursor:pointer;
  white-space:nowrap;}
.reroll-btn:active{transform:scale(.96);}
.reroll-btn:disabled{opacity:.6;cursor:default;}
.reroll-btn.spinning{animation:btnFade 1.3s ease-in-out infinite;}
.badge{font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px;background:#272727;color:var(--text-dim);}
.badge.score{color:var(--green);background:rgba(255,255,255,.12);}
.badge.gate-pass{color:var(--green);background:rgba(255,255,255,.12);}
.badge.gate-fail{color:#E57373;background:rgba(229,115,115,.12);}
.d-block{margin-bottom:13px;}
.d-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;}
.d-val{font-size:14px;line-height:1.5;color:var(--text);}
.d-val.pitch{font-style:italic;color:#ddd;}
.actions{display:flex;gap:8px;margin-top:18px;}
.abtn{flex:1;padding:12px;border-radius:10px;border:1px solid;font-size:14px;font-weight:700;
  cursor:pointer;background:transparent;transition:transform .1s;}
.abtn:active{transform:scale(.97);}
.abtn-deploy{color:var(--green);border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.10);}
.abtn-hold{color:var(--amber);border-color:rgba(255,209,102,.4);background:rgba(255,209,102,.10);}
.abtn-skip{color:#bbb;border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.04);}

/* ---- Bottom nav ---- */
.botnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:#0f0f0f;border-top:1px solid var(--line);display:flex;z-index:40;}
.tab{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text-dim);font-size:11px;font-weight:500;cursor:pointer;background:none;border:none;}
.tab.active{color:var(--text);}
.tab svg{width:22px;height:22px;}
.tab .count{position:absolute;}

/* ---- misc ---- */
.empty{padding:60px 30px;text-align:center;color:var(--text-dim);font-size:14px;line-height:1.6;}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#fff;color:#0f0f0f;
  padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:60;opacity:0;
  transition:opacity .2s;pointer-events:none;max-width:88%;text-align:center;}
.toast.show{opacity:1;}
.loading{padding:50px;text-align:center;color:var(--text-dim);}
.spinner{width:28px;height:28px;border:3px solid #333;border-top-color:var(--red);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.bf-overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:flex-end;justify-content:center;z-index:50;}
.bf-overlay.open{display:flex;}
.bf-sheet{background:var(--card,#1c1c1f);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.5);}
.bf-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.bf-title{font-size:18px;font-weight:800;}
.bf-x{background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;padding:4px 8px;}
.bf-sub{font-size:12.5px;color:var(--text-dim);line-height:1.45;margin-bottom:14px;}
.bf-list{display:flex;flex-direction:column;gap:8px;}
.bf-row{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--chip,#26262b);border-radius:10px;}
.bf-row .bf-name{flex:1;font-size:14px;font-weight:600;}
.bf-step{display:flex;align-items:center;gap:10px;}
.bf-step button{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:var(--card,#1c1c1f);color:var(--text,#fff);font-size:18px;font-weight:700;cursor:pointer;line-height:1;}
.bf-step button:active{transform:scale(.94);}
.bf-step .bf-count{min-width:20px;text-align:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
.bf-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:12px;}
.bf-total{font-size:13px;color:var(--text-dim);}
.bf-go{flex:0 0 auto;background:var(--green,#FFFFFF);color:#06120a;border:none;border-radius:10px;padding:11px 22px;font-size:15px;font-weight:800;cursor:pointer;}
.bf-go:disabled{opacity:.5;cursor:default;}
.bf-go.working{opacity:.85;}
/* Shared "currently working" indicator — a subtle opacity fade, used by ANY button
   that needs to show it's busy (Backfill, Reroll, etc.) for a consistent feel. */
.btn-working{animation:btnFade 1.3s ease-in-out infinite;}
@keyframes btnFade{0%{opacity:1}50%{opacity:.45}100%{opacity:1}}
#backfill-btn.spinning{animation:btnFade 1.3s ease-in-out infinite;}
</style>
</head>
<body>

<div class="appbar">
  <div class="yt-logo"><span class="yt-mark"></span>Discovery<span style="font-size:10px;color:var(--text-dim);font-weight:400;margin-left:4px;">v36.5</span></div>
  <button class="refresh-btn" id="refresh-btn" title="Find new stories AND render their thumbnails — one full cycle per press. To just reload the feed, re-tap the Discovery tab." onclick="refreshTap()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
  <button class="genthumb-btn" id="genthumb-btn" title="Renders every row marked ADD, one at a time, and stops the moment the last one is written." onclick="generateThumbnails()">Gen Thumbs</button>
  <button class="genthumb-btn" id="backfill-btn" title="Create new stories per channel and render their thumbnails, one at a time, until they're done" onclick="openBackfill()" style="margin-left:6px;">Backfill</button>
  <div class="src-toggles">
    <label><input type="checkbox" class="src" value="reddit" checked>Reddit</label>
    <label><input type="checkbox" class="src" value="youtube" checked>YouTube</label>
    <label><input type="checkbox" class="src" value="news" checked>News</label>
  </div>
</div>

<div class="chips" id="chips"></div>

<div class="feed" id="feed">
  <div class="loading"><div class="spinner"></div>Loading stories…</div>
</div>

<nav class="botnav" id="botnav">
  <button class="tab active" data-view="discovery">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    Discovery</button>
  <button class="tab" data-view="deployed">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 22 20H2z"/></svg>
    Deployed</button>
  <button class="tab" data-view="hold">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    On Hold</button>
  <button class="tab" data-view="skip">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6 18 18M18 6 6 18"/></svg>
    Skipped</button>
</nav>

<div class="toast" id="toast"></div>

<!-- Backfill modal: pick channels + counts, request in one go -->
<div class="bf-overlay" id="bf-overlay" onclick="if(event.target===this)closeBackfill()">
  <div class="bf-sheet">
    <div class="bf-head">
      <div class="bf-title">Backfill channels</div>
      <button class="bf-x" onclick="closeBackfill()">✕</button>
    </div>
    <div class="bf-sub">Set how many fresh stories you want per channel. One press creates them, then renders their thumbnails one at a time — the button runs until the last one is written and the feed refreshes itself.</div>
    <div class="bf-list" id="bf-list"></div>
    <div class="bf-foot">
      <div class="bf-total" id="bf-total">0 requested</div>
      <button class="bf-go" id="bf-go" onclick="submitBackfill()">Request</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// v31 — NO AUTOMATIC ANYTHING. READ THIS BEFORE CHANGING A LINE.
//
// Ryan's rule: work happens ONLY when he presses a button. Having the page
// open must never cause a single execution on the n8n side.
//
// What v31 removed, and why:
//   • ALL setInterval pollers are gone — the Gen Thumbs poller, the circle-arrow
//     watcher, the Reroll poller and the Backfill poller. In v29 those fired a
//     read every 15s, and an unflagged read kicked Discovery Refresh, which flagged
//     10 MORE rows as ADD and POSTed the Gen Thumbs webhook. One button press
//     turned into dozens of executions and hundreds of paid image renders.
//   • Polling was never needed anyway: `Respond Gen Thumbs` sits at the END of the
//     render chain (after `Write Task + Flip Status`), so the POST does not answer
//     until the thumbnail is finished and written to the sheet. Same for Reroll
//     (`Write Reroll` -> `Respond Reroll`). We simply await the response.
//   • EVERY read now goes to POLL_URL (?poll=1), with no exception. Even the
//     circle-arrow. The `Poll Only?` IF node routes ?poll=1 straight to
//     `Read Scored Stories` with no side effects, so no read this page ever
//     makes can start Discovery Refresh, Collect & Score, or an image render.
//
// RULE FOR FUTURE EDITS: do not add setInterval, setTimeout-loops, retry loops, or
// any call to READ_URL without ?poll=1. If a button needs to know when work is done,
// await its own response — the workflow already responds at the end of its chain.
//
// ── v33 ADDENDUM — THE GEN THUMBS CHAIN (and why it does not break the rule) ──
// The webhook response cannot stay open past ~2 minutes, and one thumbnail takes
// 60-70s, so a single execution can only ever render ONE row truthfully. Dashboard
// Reader v18.16 therefore locks MAX_PER_PRESS to 1 and answers every Gen Thumbs
// POST with { submitted, remaining } — `remaining` being the ADD rows still waiting.
//
// One press of Gen Thumbs now runs a CHAIN: await the response (which, by wiring,
// means one thumbnail is rendered, uploaded to R2, and written to the sheet), and
// if remaining > 0, fire the next request. This is NOT a poller and starts nothing
// in the background:
//   • every request in the chain is a WORK request — the same POST a button press
//     makes — and its response always means "this row is done and written",
//     never "check back later";
//   • the chain is strictly bounded: it ends when remaining hits 0, when any
//     request fails (no retries, ever), or at GEN_HARD_CAP requests — whichever
//     comes first. Total work can never exceed the rows Ryan himself marked ADD;
//   • no timer drives it — one request begins only because the previous one
//     finished (the only setInterval anywhere is the label-only elapsed clock);
//   • closing the tab kills the chain on the spot: the in-flight execution
//     finishes its one row server-side, no further request is ever made, and the
//     un-rendered rows keep their ADD flag so the next press resumes exactly
//     where the chain stopped. Nothing ever runs unattended.
//
// ── v34 ADDENDUM — THE CIRCLE ARROW IS NOW THE DISCOVERY CYCLE ──────────────
// One press of the circle arrow = ONE full cycle, two phases, both bounded:
//   PHASE A (one request to START_URL): Dashboard Reader's Start Run chain
//     acquires a server-side run lock, calls Discovery Refresh v2 inline and
//     WAITS — scrape, score, append (Collect and Score v19.5 renders NO
//     images), flag the top 10 no-thumbnail rows ADD — then answers
//     { flagged: N }. A second press during the scrape gets 409
//     already_running from the lock.
//   PHASE B: the SAME shared render chain Gen Thumbs uses (runRenderChain),
//     one request = one execution = one row, until remaining hits 0.
// If phase A outlives the ~2-min connection ceiling, the fetch dies but the
// execution completes server-side, the ADD flags land, and pressing Gen
// Thumbs renders them — the resume path, never a retry. The PURE feed reload
// moved to re-tapping the active Discovery tab in the bottom nav (reloadFeed).
// Every recovery toast now points there — NEVER at the circle arrow, because
// the arrow now costs a scrape (and ~1,000 YouTube API units) per press.
//
// ── v35 ADDENDUM — BACKFILL JOINS THE CHAIN ─────────────────────────────────
// Backfill v21 responds only AFTER its stories are appended and flagged ADD
// (v20 answered at plan time and kept generating afterwards — the last place
// work ran after a response). submitBackfill therefore awaits { flagged: N },
// then runs the SAME runRenderChain as Gen Thumbs and the circle arrow. All
// three buttons now share one render path, one progress display, one resume
// story (un-rendered rows keep ADD; Gen Thumbs continues them), and one
// guarantee: when the animation stops, nothing is running anywhere.
//
// ── v36 ADDENDUM — THE CIRCLE ARROW IS ONE PRESS, START TO CARDS ────────────
// The full discovery cycle (~3.5 min) can NEVER finish inside the ~2-min
// connection ceiling, so v35's wait-for-{flagged} died on every press and the
// "press Gen Thumbs in a minute" toast was the NORMAL path, not the fallback.
// Fixed with the same principle as the render chain: never hold a connection
// open past the ceiling — the open tab drives the work.
//   PHASE A: POST to START_URL now answers { status:'started', run_id }
//     INSTANTLY (Dashboard Reader v18.19 responds at lock time, then keeps
//     executing the one bounded scrape cycle server-side).
//   PHASE A-WATCH: while the arrow spins, watchDiscoverRun() reads STATUS_URL
//     every 10s. That endpoint is a pure read of the run lock — its own code
//     says "never starts anything": no scrape, no sheet touch, no YouTube
//     quota. This is a BOUNDED wait on work YOU started, not a background
//     poller: it exists only between your press and the scrape finishing,
//     stops at 8 minutes no matter what, and dies instantly with the tab
//     (the in-flight execution finishes its one cycle and stops — same as
//     today). When status flips idle WITH this press's run_id recorded, the
//     browser reads { flagged } and rolls straight into…
//   PHASE B: the shared runRenderChain — unchanged, identical for all three
//     buttons. One press: spin ~3.5 min, "Rendering 1/N…N/N", one repaint.
// Honest failure: a run that dies server-side stale-releases its lock (6 min)
// WITHOUT recording a result — idle + no matching run_id ⇒ we say so, never
// guess. DEPLOY WITH Dashboard Reader v18.19: against v18.18 this page still
// works (start answers late → the old ceiling-timeout fallback), but v35
// against v18.19 wrongly reports an empty scrape — pair the deploys.
//
// ── v36.2 ADDENDUM — THE RUN STATE LIVES IN THE SHEET NOW ───────────────────
// v36.1 + Dashboard Reader v18.19 kept the run lock in n8n workflow static
// data — which n8n only persists when an execution FINISHES. So while the
// scrape execution was still running, the status endpoint (a separate
// execution) read the STALE pre-run copy: idle, previous run_id. The watch
// loop's very first check then wrongly declared the run dead and stopped the
// arrow ~10s in — every press. Dashboard Reader v18.20 moves the lock + result
// into the sheet (tab Sheet2, row lock_key=RUN), where writes are visible to
// every reader instantly. New status contract: { running, run_id, flagged }.
// watchDiscoverRun now: running+our run_id ⇒ keep spinning; idle+our run_id ⇒
// done (flagged recorded by Finish Run); a different run_id (3 checks in a
// row, to absorb read lag) ⇒ say so and stop. DEPLOY WITH v18.20 and do the
// one-time Sheet2 setup (see the workflow sticky).
//
// ── v36.3 ADDENDUM — TELL THE SERVER THE FLAGS ARE FRESH ────────────────────
// One press rendered 1 of 10. Cause: the Dashboard Reader's `Settle Sheet
// Write` node (v18.5) pauses 6s before reading ADD flags — because Google
// Sheets doesn't make a write visible to an immediate read, and an unsettled
// read was catching only 1-3 of 10 fresh flags. But it only settles when the
// POST says source:'discovery_refresh' — which the DELETED server-side
// self-POST used to send. The browser chain sent a plain {action:'gen_thumbs'}
// and read straight through the propagation lag: submitted 1, remaining 0,
// honest-but-blind, chain over.
// Fix, browser-side only (no workflow change): when the chain follows a
// flag-producing phase (circle arrow / Backfill), its FIRST request carries
// { source:'discovery_refresh', picked:N } so the server settles 6s before
// reading — exactly the path v18.5 built. And if the server still reports
// remaining:0 while done < picked, the chain makes ONE 5s-paused follow-up
// request (also settled) before believing it; a follow-up that finds nothing
// ends the chain with an honest "X of N — press Gen Thumbs to finish" toast.
// Bounded as ever: the same GEN_HARD_CAP, no retries of failures, dies with
// the tab. Rows the read never sees keep their ADD flag — nothing is lost.
// ═══════════════════════════════════════════════════════════════════════════

const READ_URL = 'https://askai.app.n8n.cloud/webhook/nano-dashboard-read';
// The ONLY URL this page reads from. ?poll=1 = pure read, zero side effects.
const POLL_URL = READ_URL + '?poll=1';
const ACT_URL  = 'https://askai.app.n8n.cloud/webhook/nano-dashboard-action';
const GEN_URL  = 'https://askai.app.n8n.cloud/webhook/nano-gen-thumb';
const REROLL_URL = 'https://askai.app.n8n.cloud/webhook/nano-reroll';
const BACKFILL_URL = 'https://askai.app.n8n.cloud/webhook/nano-backfill';
// v34: the circle arrow's discover step. ONE bounded request: scrape -> score ->
// append -> flag top 10, answered only when flagging is complete (run-locked
// server-side, 409 already_running on a second press).
const START_URL = 'https://askai.app.n8n.cloud/webhook/nano-dashboard-start';
// v36: read-only status of the discovery run lock (Dashboard Reader's
// nano-dashboard-status chain — reads static data, starts NOTHING, no quota).
const STATUS_URL = 'https://askai.app.n8n.cloud/webhook/nano-dashboard-status';

// 10 canonical categories (chip labels are short; match against full Channel Category)
const CATS = ['All','Night Feed','True Crime','History','Science','Psychology','Horror','Survival','Technology','Philosophy','Travel'];
// map short chip -> substring to match the full canonical category coming from the sheet
const CAT_MATCH = {
  'Night Feed':'Mystery & The Unknown', 'True Crime':'True Crime', 'History':'History',
  'Science':'Science', 'Psychology':'Psychology', 'Horror':'Horror & Dark',
  'Survival':'Survival', 'Technology':'Technology', 'Philosophy':'Philosophy', 'Travel':'Travel'
};

let allStories=[];
let activeCat='All';
let activeView='discovery';
// One-time migration: older cached builds could persist a stale 'select' under a
// card's URL. Purge any localActs on load for build v28 so no ghost survives the
// cache swap; the sheet is the source of truth and will repaint correct state.
let localActs = JSON.parse(localStorage.getItem('nano_acts')||'{}');
if(localStorage.getItem('nano_build')!=='v29'){ localActs={}; try{localStorage.setItem('nano_acts','{}');localStorage.setItem('nano_build','v29');}catch(_){} }
function saveActs(){ try{localStorage.setItem('nano_acts',JSON.stringify(localActs));}catch(_){} }

// ── v36.5: WHEN THE LAST SHEET READ HAPPENED ─────────────────────────────
// effStatus needs to know whether the `status` on a card is OLDER or NEWER
// than the tap sitting in localActs. Without this the local bridge below is
// unreachable and Deploy cannot move a card. Set at the end of every load().
let lastLoadAt = 0;

// Local actions are now { a: <action>, ts: <when tapped> }. Old builds stored a
// bare string, so read through this shim rather than indexing localActs directly.
function actOf(url){
  const v = localActs[url];
  if(!v) return null;
  return (typeof v === 'string') ? { a: v, ts: 0 } : v;
}
const ACT_TTL_MS = 30 * 60 * 1000;   // a tap the sheet never confirmed goes stale after 30 min

const SHEET_ACTIONS = new Set(['selected','hold','skip']);
// The workflow sets Status='scored' on EXACTLY the rows you re-request via Gen Thumbs
// or Reroll — the deliberate "return to Discovery" signal.
const SHEET_RETURNS_TO_DISCOVERY = new Set(['scored','ready_for_idea_generation']);
// THE SHEET IS THE SOURCE OF TRUTH. Your Deploy/Hold/Skip taps are written to the
// sheet's Status column (Update Status node, matched by Source URL), so on the next
// load the sheet already reflects them across every device. localStorage is kept only
// as a brief optimistic bridge: it makes a card move the instant you tap, before the
// sheet round-trip completes — but the sheet always wins once it has a definitive value.
const effStatus = s => {
  const act = actOf(s.source_url);

  // 1) Sheet has a definitive triage action → it wins. Authoritative and
  //    cross-device. Clear any local bridge entry; the sheet carries the truth.
  if(SHEET_ACTIONS.has(s.status)){
    if(localActs[s.source_url]) { delete localActs[s.source_url]; saveActs(); }
    return s.status;
  }

  // 2) v36.5 BUG FIX — this rule used to run before the local bridge and delete
  //    the tap outright. EVERY deployable card carries status 'scored', so the
  //    bridge at (3) was unreachable and a Deploy never moved a card: it just
  //    collapsed and stayed in Discovery. A 'scored' reading only overrules a tap
  //    when the sheet data is NEWER than the tap — i.e. a load ran after it and
  //    still reports 'scored' (the deliberate Gen Thumbs / Reroll return signal).
  if(SHEET_RETURNS_TO_DISCOVERY.has(s.status)){
    const bridgeIsFresh = act && act.ts > lastLoadAt && (Date.now() - act.ts) < ACT_TTL_MS;
    if(!bridgeIsFresh){
      if(localActs[s.source_url]){ delete localActs[s.source_url]; saveActs(); }
      return 'scored';
    }
    return act.a === 'select' ? 'selected' : act.a;
  }

  // 3) No definitive sheet value yet → optimistic local bridge (covers the window
  //    between tapping and the sheet write landing).
  if(act && (Date.now() - act.ts) < ACT_TTL_MS){
    return act.a === 'select' ? 'selected' : act.a;
  }
  return s.status || 'scored';
};

// ── v28: DISPLAY-SIDE SOURCE-SUFFIX STRIP ────────────────────────────────
// Google News appends " - Publisher" (often " - Outlet | City") to every headline.
// Collect and Score v19.1 now strips this at ingestion, but every row written
// BEFORE v19.1 still carries the publisher in its stored Title. Showing an outlet
// name on our card reads as if we're reproducing that outlet's article or are
// affiliated with them — we're not; these are original stories merely inspired by
// a trending topic. So we also strip on display, which cleans legacy rows instantly
// and needs no sheet migration. Conservative: only trailing chunks that look like a
// publisher (short, few words, no sentence-ending punctuation) are removed, so real
// subtitles like "…: What We Know" survive untouched.
function stripSrcDisplay(t){
  let x = String(t == null ? '' : t).trim();
  for(let p=0; p<2; p++){
    const m = x.match(/^(.*\S)\s+[-\u2013\u2014|]\s+([^-\u2013\u2014|]{2,45})$/);
    if(m && !/[.!?:;]$/.test(m[2]) && m[2].split(/\s+/).filter(Boolean).length <= 6){
      x = m[1].trim();
    } else break;
  }
  return x || String(t == null ? '' : t).trim();
}

// ---- data fetch — ALWAYS a pure read, never starts work ----
// There is no `poll` option any more because there is no non-poll mode. Every read
// this page performs is side-effect free. See the v31 banner at the top.
async function load(){
  const rb=document.getElementById('refresh-btn');
  if(rb) rb.classList.add('spinning');
  try{
    const res = await fetch(POLL_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    allStories = data.stories || [];
  }catch(e){
    // A failed read must never wipe cards already on screen.
    if(!allStories.length){
      document.getElementById('feed').innerHTML =
        '<div class="empty">Couldn\'t reach the pipeline.<br>'+e.message+'</div>';
    } else {
      toast('Refresh failed — showing the last loaded cards');
    }
    if(rb) rb.classList.remove('spinning');
    return false;
  }
  if(rb) rb.classList.remove('spinning');
  lastLoadAt = Date.now();   // v36.5: any tap older than this is now the sheet's business
  renderChips();
  render();
  return true;
}

// Pure feed reload — reads the sheet, repaints, starts NOTHING. Reached by
// re-tapping the active Discovery tab in the bottom nav (v34: the circle
// arrow is the discovery cycle now, so the cheap reload lives here).
async function reloadFeed(){
  const before = allStories.filter(s=>(s.thumbnail_url||'').trim()).length;
  const ok = await load();
  if(!ok) return;
  const after = allStories.filter(s=>(s.thumbnail_url||'').trim()).length;
  const gained = after - before;
  toast(gained>0 ? `Feed reloaded — ${gained} new thumbnail${gained===1?'':'s'} at the top`
                 : `Feed reloaded — ${after} thumbnails, nothing new`);
}

// ---- Circle arrow: ONE full discovery cycle per press. ----
// Phase A: one request that answers { started, run_id } at lock time; the one
// bounded scrape cycle continues server-side. Phase A-watch: bounded 10s
// status reads (pure, read-only) until THIS run's result is recorded.
// Phase B: the shared Gen Thumbs render chain, one row per execution.
// The arrow spins through ALL of it and stops when the last row is written.
// No retries; closing the tab ends everything after the in-flight execution.
// See the v36 addendum in the banner above.
let discoverBusy=false;
async function refreshTap(){
  if(discoverBusy){ toast('A discovery run is already in progress'); return; }
  if(genBusy||bfBusy){ toast('Another run is in progress — wait for it to finish'); return; }
  const rb=document.getElementById('refresh-btn');
  discoverBusy=true;
  if(rb) rb.classList.add('spinning');
  toast('Finding new stories — the scrape takes 3-4 minutes. Leave the page open.');
  let flagged=0;
  try{
    const res=await fetch(START_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({source:'circle_arrow'})});
    const data=await res.json().catch(()=>({}));
    if(data && data.status==='already_running'){
      toast('A discovery run is already going on the server — try again in a minute');
      discoverBusy=false; if(rb) rb.classList.remove('spinning'); return;
    }
    if(data && data.status==='started' && data.run_id){
      // Dashboard Reader v18.19: answered at lock time. The scrape is running
      // server-side as ONE bounded execution — watch it, don't hold a doomed
      // connection open through the ceiling.
      const w=await watchDiscoverRun(String(data.run_id));
      if(w.outcome!=='done'){
        discoverBusy=false; if(rb) rb.classList.remove('spinning'); return;
      }
      flagged=w.flagged;
    } else {
      // Dashboard Reader v18.18 shape: the server only answers { flagged } after
      // the whole cycle — which only arrives if the run beat the ceiling.
      flagged=Number((data && data.flagged) || 0);
    }
  }catch(err){
    // Old-workflow path only (v18.19 answers instantly): the connection died at
    // the ~2-min ceiling. The scrape is still finishing server-side and will
    // flag its rows; NOTHING further starts on its own. Do not retry.
    console.error('discover phase failed/timed out:',err);
    toast('The scrape is taking longer than the connection allows — in a minute, press Gen Thumbs to render what it found');
    discoverBusy=false; if(rb) rb.classList.remove('spinning'); return;
  }
  if(flagged===0){
    await load();
    toast('Scrape finished — nothing new qualified for a thumbnail');
    discoverBusy=false; if(rb) rb.classList.remove('spinning'); return;
  }
  toast(`${flagged} stor${flagged===1?'y':'ies'} flagged — rendering them one at a time…`);
  const r=await runRenderChain(flagged);     // arrow keeps spinning through phase B
  if(!r.err && r.done===0){
    // The flags landed but the render read didn't see them yet.
    toast('Flagged rows were not visible yet — press Gen Thumbs in a minute to render them');
  }
  discoverBusy=false;
  if(rb) rb.classList.remove('spinning');
}

// Watch a started discovery run to completion. A BOUNDED wait on work YOU
// started, not a background poller: it exists only while the arrow spins,
// each check is one GET to STATUS_URL (a read of the run lock that — per its
// own code — never starts anything, touches no sheet, costs no quota), it
// stops dead at 8 minutes, and closing the tab kills it instantly.
async function watchDiscoverRun(runId){
  const t0=Date.now();
  const MAX_MS=8*60*1000;    // hard stop (cycle ~3.5-4 min; stale lock treated idle at 6)
  const EVERY_MS=10000;      // ≤48 status reads per press, then silence
  let lastToastMin=0;
  let mismatches=0;          // consecutive polls showing a different run_id
  while(Date.now()-t0 < MAX_MS){
    await new Promise(r=>setTimeout(r,EVERY_MS));
    let st=null;
    try{ const res=await fetch(STATUS_URL); st=await res.json(); }
    catch(_){ continue; }    // one missed read is fine — the loop stays time-bounded
    if(!st) continue;
    const sameRun = String(st.run_id||'')===runId;
    if(!sameRun){
      // The lock row shows a different run. One stale read can happen right at
      // the start; three in a row means our run was replaced or never wrote.
      if(++mismatches>=3){
        toast('The scrape stopped without finishing — check the n8n Executions list, then press Gen Thumbs to render anything it flagged');
        return {outcome:'failed'};
      }
      continue;
    }
    mismatches=0;
    if(st.running){
      const m=Math.floor((Date.now()-t0)/60000);
      if(m>lastToastMin){ lastToastMin=m; toast('Still scraping — '+m+' min in. Leave the page open.'); }
      continue;
    }
    // Idle under OUR run_id: Finish Run wrote the result. flagged is the count.
    return {outcome:'done', flagged:Number(st.flagged||0)};
  }
  toast('The scrape is taking unusually long — in a few minutes, press Gen Thumbs to render what it found');
  return {outcome:'timeout'};
}

function renderChips(){
  const c=document.getElementById('chips');
  c.innerHTML='';
  CATS.forEach(cat=>{
    const b=document.createElement('button');
    b.className='chip'+(cat===activeCat?' active':'');
    b.textContent=cat;
    b.onclick=()=>{activeCat=cat;renderChips();render();};
    c.appendChild(b);
  });
}

function viewMatch(s){
  const eff=effStatus(s);
  if(activeView==='discovery') return !SHEET_ACTIONS.has(eff) || eff==='scored';
  if(activeView==='deployed')  return eff==='selected';
  if(activeView==='hold')      return eff==='hold';
  if(activeView==='skip')      return eff==='skip';
  return true;
}
function catMatch(s){
  if(activeCat==='All') return true;
  const want=CAT_MATCH[activeCat]||activeCat;
  return (s.channel_category||'').includes(want);
}
function srcMatch(s){
  const on=[...document.querySelectorAll('.src:checked')].map(x=>x.value);
  return on.includes((s.source||'').toLowerCase()) || on.length===3;
}

function fmtViews(n){
  n=+n||0;
  if(n>=1e6) return (n/1e6).toFixed(1).replace('.0','')+'M';
  if(n>=1e3) return (n/1e3).toFixed(0)+'K';
  return n;
}
function relDate(d){
  if(!d) return '';
  const t=new Date(d).getTime(); if(isNaN(t)) return '';
  const days=Math.floor((Date.now()-t)/864e5);
  if(days<=0) return 'today';
  if(days===1) return '1 day ago';
  if(days<30) return days+' days ago';
  const mo=Math.floor(days/30); if(mo<12) return mo+(mo===1?' month ago':' months ago');
  const yr=Math.floor(days/365); return yr+(yr===1?' year ago':' years ago');
}
// Pull the render timestamp out of an R2 thumbnail key. Returns 0 when there isn't
// one, so those rows fall to the bottom rather than jumping to the top.
function renderedAt(s){
  const url=String((s&&s.thumbnail_url)||'');
  const file=url.split('/').pop()||'';
  let best=0;
  (file.match(/\d{13}/g)||[]).forEach(n=>{ const v=+n; if(v>1.5e12 && v<4e12 && v>best) best=v; });
  return best;
}
// A thumbnail rendered in the last 2 hours gets a NEW pill, so a fresh batch is
// unmistakable even when several land at once.
const NEW_WINDOW_MS = 2*60*60*1000;
function isNew(s){ const t=renderedAt(s); return t>0 && (Date.now()-t) < NEW_WINDOW_MS; }

const initials = name => (name||'?').replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';

function render(){
  const feed=document.getElementById('feed');
  let list=allStories.filter(s=>catMatch(s)&&viewMatch(s)&&srcMatch(s));
  // Discovery: only show cards that already carry a real baked thumbnail.
  // (Blank rows stay in the sheet — they're just hidden here until rendered.)
  if(activeView==='discovery') list=list.filter(s=>(s.thumbnail_url||'').trim());
  // Newest first. Prefer Date Added; fall back to sheet row order (later row = newer).
  const ts=s=>{const t=new Date(s.date_added||0).getTime();return isNaN(t)?0:t;};
  // ── v32: SORT DISCOVERY BY RENDER TIME, NOT DISCOVERY DATE ──────────────
  // The render time is already in the data: every R2 key carries the Date.now() that
  // made it. Three key shapes exist and all three parse —
  //   thumbs/753-1785440849974.jpg        Gen Thumbs (v18.13+)
  //   thumbs/<row>-<ts>.png               Gen Thumbs (older)
  //   thumbs/new-<ts>-<rand>.png          Collect & Score
  // so we take the largest 13-digit epoch in the filename. Newest render first.
  if(activeView==='discovery') list.sort((a,b)=> (renderedAt(b)-renderedAt(a)) || (ts(b)-ts(a)) || ((+b.row_number||0)-(+a.row_number||0)) );
  else                         list.sort((a,b)=> (ts(b)-ts(a)) || ((+b.row_number||0)-(+a.row_number||0)) );
  // bottom-nav active state
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===activeView));
  if(!list.length){
    feed.innerHTML='<div class="empty">No stories here yet.<br>'+
      (activeView==='discovery'?'Mark a row Thumbnail Request = ADD, then press Gen Thumbs.':'Nothing in this bucket.')+'</div>';
    return;
  }
  feed.innerHTML='';
  list.forEach(s=>feed.appendChild(card(s)));
}

function card(s){
  const eff=effStatus(s);
  const el=document.createElement('div');
  el.className='card'; el.dataset.eff=eff; el.dataset.url=s.source_url||'';

  const headline=(s.thumbnail_headline||s.thumbnail_text||'').trim();
  const thumbUrl=(s.thumbnail_url||'').trim();
  const dur = s.source==='youtube' && s.duration ? s.duration : '';

  // ---- thumbnail (the baked-in image is the art; headline shown only as fallback text) ----
  const thumbInner = thumbUrl
    ? `<img src="${thumbUrl}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<div class=&quot;thumb-fallback&quot;>${(headline||'No thumbnail yet').replace(/"/g,'')}</div>'">`
    : `<div class="thumb-fallback">${headline||'Thumbnail pending'}</div>`;

  // YouTube-style metadata: channel name = the channel this story is FOR; views/age from the source signal
  const chName = s.channel_category ? shortCat(s.channel_category) : (s.source_name||'NanoRunway');
  const viewBits=[];
  if(s.source==='youtube' && s.viral_count) viewBits.push(fmtViews(s.viral_count)+' views');
  if(s.source_name && s.source==='youtube') viewBits.unshift(s.source_name);
  const ageStr=relDate(s.date_added);
  const subline=[chName, viewBits.join(' · '), ageStr].filter(Boolean).join(' · ');

  el.innerHTML=`
    <div class="thumb-wrap">${isNew(s)?'<span class="newpill">NEW</span>':''}${thumbInner}${dur?`<span class="dur">${dur}</span>`:''}</div>
    <div class="statusline"></div>
    <div class="meta">
      <div class="avatar">${initials(chName)}</div>
      <div class="meta-text">
        <div class="vid-title">${esc(stripSrcDisplay(s.youtube_title||s.title)||'Untitled')}</div>
        <div class="vid-sub">${esc(subline)}</div>
      </div>
      <div class="kebab">⋮</div>
    </div>
    ${detailHTML(s)}`;

  // tap card toggles detail (ignore taps on action buttons)
  el.querySelector('.meta').onclick=()=>el.classList.toggle('open');
  el.querySelector('.thumb-wrap').onclick=()=>el.classList.toggle('open');
  el.querySelectorAll('.abtn').forEach(b=>{
    b.onclick=(ev)=>{ev.stopPropagation();sendAction(b.dataset.act,s,el);};
  });
  const rb=el.querySelector('.reroll-btn');
  if(rb) rb.onclick=(ev)=>{ev.stopPropagation();rerollStory(s,el);};
  return el;
}

function detailHTML(s){
  const score=parseFloat(s.score)||parseFloat(s.viral_score)||0;
  const gate=(s.gate_pass||'').toString().toUpperCase()==='TRUE'||s.gate_pass===true;
  const job=s.thumbnail_job?`<span class="badge">${esc(s.thumbnail_job)}</span>`:'';
  return `<div class="detail">
    <div class="d-row">
      ${score?`<span class="badge score">★ ${score.toFixed(1)}</span>`:''}
      <span class="badge ${gate?'gate-pass':'gate-fail'}">${gate?'GATE PASS':'GATE FAIL'}</span>
      <span class="badge">${esc(s.source||'')}</span>
      ${job}
      <button class="reroll-btn" data-act="reroll" title="Re-read: fix category, regenerate thumbnail & headline">⟳ Reroll</button>
    </div>
    ${block('Headline',(s.thumbnail_headline||s.thumbnail_text))}
    ${block('Elevator Pitch',s.elevator_pitch,'pitch')}
    ${block('Caption',s.caption)}
    ${block('Thumbnail Concept',s.thumbnail_concept)}
    ${block('What Really Happened',trimText((s.story_summary&&s.story_summary.trim())?s.story_summary:s.story_text))}
    ${block('Audience Hook',s.audience_hook)}
    <div class="actions">
      <button class="abtn abtn-deploy" data-act="select">Deploy</button>
      <button class="abtn abtn-hold"   data-act="hold">Hold</button>
      <button class="abtn abtn-skip"   data-act="skip">Skip</button>
    </div>
  </div>`;
}
function block(label,val,cls=''){
  if(!val||!String(val).trim()) return '';
  return `<div class="d-block"><div class="d-label">${label}</div><div class="d-val ${cls}">${esc(val)}</div></div>`;
}
// Fallback for "What Really Happened" when the scorer left Story Summary blank.
// Goal: a quick 3-4 sentence scan, not a wall of text. Takes the first few complete
// sentences of the raw Story Text, with a hard char backstop so a run-on can't sprawl.
function trimText(t){
  t=String(t||'').replace(/\s+/g,' ').trim(); if(!t) return '';
  const MAX_SENTENCES=4, HARD_CAP=360;
  // split into sentences, keeping their end punctuation
  const sentences=t.match(/[^.!?]+[.!?]+/g) || [t];
  let out='';
  for(let i=0;i<sentences.length && i<MAX_SENTENCES;i++){
    const next=(out+sentences[i]).trim();
    if(next.length>HARD_CAP){ if(!out) out=sentences[i].slice(0,HARD_CAP).trim()+'…'; break; }
    out=next;
  }
  return out.trim();
}

// ---- action POST (unchanged contract: action, source_url, story) ----
async function sendAction(action,story,el){
  const url=story.source_url;
  if(!url){ toast('This card has no Source URL — it cannot be deployed'); return; }

  // v36.5: guard the double tap. Deploy appends a WINNER row and starts a script
  // run, and a second press used to append a second one (four duplicate rows on
  // 2026-06-16 came from exactly this).
  if(el.dataset.busy==='1') return;
  el.dataset.busy='1';
  el.querySelectorAll('.abtn').forEach(b=>b.disabled=true);

  localActs[url]={ a:action, ts:Date.now() }; saveActs();
  el.dataset.eff = action==='select'?'selected':action;
  el.classList.remove('open');
  render();                                    // move it out of Discovery immediately
  toast(action==='select'?'Deploying — writing to WINNER…':action==='hold'?'On hold':'Skipped');

  try{
    const res = await fetch(ACT_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action,source_url:url,story})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    // Reader v18.23 responds AFTER Update Status writes the sheet, so a reload now
    // returns the real status and the card lands in its tab on the sheet's authority,
    // not on localStorage's. On an older Reader this reload is harmless: the bridge
    // is still fresher than the load and holds the card in Deployed for the session.
    if(action==='select'){
      await load();
      toast('Deployed ✓ — check n8n Executions for the script run');
    }
  }catch(err){
    console.error('action failed:',err);
    toast('Deploy failed to reach the pipeline — the card was NOT written');
    delete localActs[url]; saveActs();          // do not fake a success
    el.dataset.eff = story.status || 'scored';
    render();
  }finally{
    el.dataset.busy='0';
    el.querySelectorAll('.abtn').forEach(b=>b.disabled=false);
  }
}

// ---- Reroll: one press, one run, one repaint. ----
// `Write Reroll` -> `Respond Reroll` is the last link in that chain, so this fetch
// does not resolve until the reroll has finished and been written to the sheet.
// We await it, repaint once, and stop. No poller.
async function rerollStory(story,el){
  const url=story.source_url;
  if(!url){ toast('Reroll: missing source URL'); return; }
  const btn=el.querySelector('.reroll-btn');
  if(btn && btn.disabled) return;                     // guard against a double tap
  if(btn){ btn.disabled=true; btn.classList.add('spinning'); }
  const stopClock=startClock(btn,'⟳ Rerolling');
  toast('Rerolling — this takes a minute or two. Leave the page open.');
  try{
    const res=await fetch(REROLL_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'reroll',source_url:url,story})});
    const data=await res.json().catch(()=>({}));
    const cat=data&&data.category?data.category:null;
    const changed=data&&data.changed;
    // Clear any local action so the rerolled row is free to return to Discovery.
    if(localActs[url]){ delete localActs[url]; saveActs(); }
    activeView='discovery';
    await load();                                     // single repaint, pure read
    toast(cat?(changed?`Reroll done — recategorized to ${shortCat(cat)}`:`Reroll done — ${shortCat(cat)}`):'Reroll done ✓');
  }catch(err){
    console.error('reroll failed:',err);
    // The connection dropped, but the render is still finishing server-side.
    toast('Lost the connection — re-tap the Discovery tab in a minute to see the result');
  }finally{
    stopClock();
    const liveBtn=document.querySelector(`.card[data-url="${cssEsc(url)}"] .reroll-btn`) || btn;
    if(liveBtn){ liveBtn.classList.remove('spinning'); liveBtn.disabled=false; liveBtn.textContent='⟳ Reroll'; }
  }
}
function cssEsc(s){ return String(s).replace(/["\\]/g,'\\$&'); }

// ---- Backfill: request N stories per channel. ----
const BF_CHANNELS = CATS.filter(c=>c!=='All');
const bfCounts = {};   // {shortLabel: n}
function openBackfill(){
  BF_CHANNELS.forEach(c=>{ if(bfCounts[c]==null) bfCounts[c]=0; });
  const list=document.getElementById('bf-list');
  list.innerHTML='';
  BF_CHANNELS.forEach(c=>{
    const row=document.createElement('div'); row.className='bf-row';
    row.innerHTML=`<div class="bf-name">${c}</div>
      <div class="bf-step">
        <button aria-label="less" onclick="bfBump('${c.replace(/'/g,"\\'")}',-1)">–</button>
        <span class="bf-count" id="bf-c-${cssId(c)}">${bfCounts[c]}</span>
        <button aria-label="more" onclick="bfBump('${c.replace(/'/g,"\\'")}',1)">+</button>
      </div>`;
    list.appendChild(row);
  });
  bfUpdateTotal();
  document.getElementById('bf-overlay').classList.add('open');
}
function closeBackfill(){ document.getElementById('bf-overlay').classList.remove('open'); }
function cssId(c){ return c.replace(/[^A-Za-z0-9]/g,'-'); }
function bfBump(c,d){
  bfCounts[c]=Math.max(0,Math.min(20,(bfCounts[c]||0)+d));
  const el=document.getElementById('bf-c-'+cssId(c)); if(el) el.textContent=bfCounts[c];
  bfUpdateTotal();
}
function bfUpdateTotal(){
  const total=Object.values(bfCounts).reduce((a,b)=>a+(+b||0),0);
  document.getElementById('bf-total').textContent=total+' requested';
  document.getElementById('bf-go').disabled = total<1;
}
// v35 (pairs with NanoRunway_Backfill_v21): the response now arrives only AFTER
// the stories are created, appended, and flagged ADD — it means "rows exist",
// not "accepted". Phase B is the same shared render chain the other two buttons
// use, so the Backfill button runs truthfully until the last thumbnail is
// written. Deploy v35 and Backfill v21 TOGETHER: against the old v20 backend
// (which answers at plan time with {generating}) this reads flagged=0 and
// correctly does not start the chain.
let bfBusy=false;
async function submitBackfill(){
  const requests=[];
  BF_CHANNELS.forEach(c=>{
    const n=+bfCounts[c]||0;
    if(n>0) requests.push({ category: CAT_MATCH[c]||c, count:n });
  });
  if(!requests.length){ return; }
  if(bfBusy){ return; }
  if(genBusy||discoverBusy){ toast('Another run is in progress — wait for it to finish'); return; }
  bfBusy=true;
  const go=document.getElementById('bf-go');
  const bfBtn=document.getElementById('backfill-btn');
  go.disabled=true; go.classList.add('working'); go.textContent='Working…';
  if(bfBtn) bfBtn.classList.add('spinning');
  const stopClock=startClock(bfBtn,'Creating');
  const summary=requests.map(r=>`${r.count} ${shortCat(r.category)}`).join(', ');
  toast('Creating stories — '+summary+'. Takes about a minute.');
  let flagged=0;
  try{
    const res=await fetch(BACKFILL_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({requests})});
    const data=await res.json().catch(()=>({}));
    flagged=Number((data&&data.flagged)||0);
  }catch(err){
    // The connection dropped; creation may still finish server-side, and any rows
    // it appends carry ADD — a Gen Thumbs press renders them. Never retry.
    console.error('backfill failed:',err);
    stopClock();
    if(bfBtn){ bfBtn.classList.remove('spinning'); bfBtn.textContent='Backfill'; }
    go.disabled=false; go.classList.remove('working'); go.textContent='Request';
    bfUpdateTotal(); bfBusy=false;
    toast('Lost the connection — in a minute, press Gen Thumbs to render whatever was created');
    return;
  }
  stopClock();
  if(bfBtn){ bfBtn.classList.remove('spinning'); bfBtn.textContent='Backfill'; }
  go.disabled=false; go.classList.remove('working'); go.textContent='Request';
  bfUpdateTotal();
  closeBackfill();
  activeView='discovery';
  if(flagged===0){
    await load();
    toast('Backfill made no stories — nothing to render');
    bfBusy=false;
    return;
  }
  toast(`${flagged} stor${flagged===1?'y':'ies'} created — rendering them one at a time…`);
  const r=await runRenderChain(flagged);              // same chain as Gen Thumbs + circle arrow
  if(!r.err && r.done===0){
    toast('Created rows were not visible yet — press Gen Thumbs in a minute to render them');
  }
  bfBusy=false;
}

function shortCat(c){
  if(!c) return '';
  if(c.includes('Mystery'))return'Night Feed';
  if(c.includes('Horror'))return'Horror';
  if(c.includes('True Crime'))return'True Crime';
  if(c.includes('Psychology'))return'Psychology';
  if(c.includes('Science'))return'Science';
  if(c.includes('Technology'))return'Technology';
  if(c.includes('Survival'))return'Survival';
  if(c.includes('Philosophy'))return'Philosophy';
  if(c.includes('Travel'))return'Travel';
  if(c.includes('History'))return'History';
  return c;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// ── v32/v33: ELAPSED CLOCK ───────────────────────────────────────────────
// READ THIS BEFORE YOU PANIC ABOUT THE WORD setInterval.
// This ticks a button's TEXT once a second so a long job reads as "0:47" instead of
// an ambiguous pulse. It makes NO network call, touches NO webhook, and starts NO
// work of any kind — it only rewrites a label. Every one is cleared when its job
// ends, so it cannot outlive the request it belongs to. This is a stopwatch, not a
// poller; the v31 rule against polling is untouched.
// v33: `label` may be a STRING or a FUNCTION returning a string, so the Gen Thumbs
// chain can show live progress ("Rendering 2/5 1:34") without any extra timer.
function startClock(btn, label){
  if(!btn) return ()=>{};
  const t0=Date.now();
  const paint=()=>{ const s=Math.floor((Date.now()-t0)/1000);
    const lbl=(typeof label==='function')?label():label;
    btn.textContent = lbl+' '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
  paint();
  const id=setInterval(paint, 1000);
  return ()=>clearInterval(id);
}

let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200);}

// ---- Shared render chain: ONE bounded chain of single-row executions. ----
// Dashboard Reader v18.16+ renders exactly ONE ADD row per execution (~60-70s,
// always inside the 2-minute webhook ceiling) and answers { submitted, remaining }.
// `Respond Gen Thumbs` is wired after `Write Task + Flip Status` on the loop's DONE
// output, so each response means: that row is rendered, uploaded to R2, and written
// to the sheet. We await each response and fire the next request ONLY if the server
// says remaining > 0. When remaining hits 0 the chain stops dead: one repaint, done.
// No timers drive this, no request is ever retried, and closing the tab ends the
// chain immediately. v34: used by BOTH the Gen Thumbs button and the circle
// arrow's phase B — the ONLY render driver in the whole system. See the v33/v34
// addenda in the banner at the top of this script.
let genBusy=false;
async function runRenderChain(expected){
  expected=Number(expected||0);      // flags just written by phase A (0 = manual press, no settle needed)
  const btn=document.getElementById('genthumb-btn');
  const original='Gen Thumbs';
  genBusy=true;
  btn.disabled=true; btn.classList.add('rendering');
  let done=0;                                         // rows confirmed rendered+written
  let total=0;                                        // done + remaining, learned from the first response
  const stopClock=startClock(btn, ()=> total>0 ? `Rendering ${Math.min(done+1,total)}/${total}` : 'Rendering…');
  // Safety backstop only. The real bound is the server's `remaining` count, which
  // can never exceed the rows marked ADD. This cap just guarantees the chain is
  // finite even if a future workflow bug reported `remaining` wrong forever.
  const GEN_HARD_CAP=20;
  let err=null;
  let lastRemaining=0;                                // >0 after the loop = cap exit
  // v36.3: when the flags were written seconds ago, tell the server so its
  // Settle Sheet Write pauses 6s before the read (the v18.5 propagation fix).
  let settleNext = expected>0;
  let graceUsed=false;                                // one follow-up look, max
  try{
    for(let i=0;i<GEN_HARD_CAP;i++){
      const body={action:'gen_thumbs'};
      if(settleNext){ body.source='discovery_refresh'; body.picked=expected; settleNext=false; }
      const res=await fetch(GEN_URL,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body)});
      const data=await res.json().catch(()=>({}));
      const n=(data&&typeof data.submitted==='number')?data.submitted:0;
      const remaining=(data&&typeof data.remaining==='number')?data.remaining:0;
      if(n===0){ lastRemaining=0; break; }            // nothing (left) marked ADD
      done+=n;
      total=Math.max(done+remaining, expected);
      lastRemaining=remaining;
      if(remaining<=0){
        // Server sees no more ADD rows. If phase A said there should be more,
        // give the sheet one settled second look before believing it — a
        // single bounded follow-up request, not a retry of anything.
        if(expected>done && !graceUsed){
          graceUsed=true; settleNext=true;
          toast(`${done} rendered — double-checking for ${expected-done} more that may not be visible yet…`);
          await new Promise(r=>setTimeout(r,5000));
          continue;
        }
        break;                                        // last row written — chain stops dead
      }
      toast(`${done} of ${total} rendered — next one starting…`);
    }
  }catch(e){
    console.error('render chain stopped:',e);
    err=e;
  }
  stopClock();
  genBusy=false;
  btn.classList.remove('rendering'); btn.disabled=false;
  if(err){
    // The connection dropped mid-chain. The in-flight row is still finishing
    // server-side; every un-rendered row keeps its ADD flag. Do NOT retry — that
    // would double the spend. Rendering resumes on the next Gen Thumbs press.
    btn.textContent=original;
    toast(done>0
      ? `Lost the connection after ${done} — in a minute, press Gen Thumbs to finish the rest`
      : 'Lost the connection — the render may still be finishing. Re-tap the Discovery tab in a minute to reload.');
    return {done, err};
  }
  if(done>0){
    await load();                                     // single repaint, pure read
    // Cap exit: the per-press backstop (GEN_HARD_CAP) stopped the chain with rows
    // still flagged — say so instead of claiming completion. One more Gen Thumbs
    // press resumes exactly where this one stopped.
    const short = (expected>done && lastRemaining<=0);
    toast(lastRemaining>0
      ? `${done} rendered — ${lastRemaining} still flagged. Press Gen Thumbs to continue.`
      : short
        ? `${done} of ${expected} rendered — the rest keep their ADD flag. Press Gen Thumbs to finish.`
        : `Done ✓ — ${done} thumbnail${done===1?'':'s'} rendered`);
    btn.textContent = (lastRemaining>0 || short) ? original : 'Done ✓';
    setTimeout(()=>{ if(btn.textContent==='Done ✓') btn.textContent=original; },2500);
  }else{
    btn.textContent=original;
  }
  return {done, err:null};
}
async function generateThumbnails(){
  if(genBusy||discoverBusy||bfBusy) return;           // a second tap does nothing
  toast('Rendering — about a minute per story. Leave the page open.');
  const r=await runRenderChain();
  if(!r.err && r.done===0) toast('No rows marked ADD — nothing to render');
}

// bottom nav + source toggles
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  if(t.dataset.view===activeView){ reloadFeed(); return; }   // v34: re-tap the active tab = pure feed reload
  activeView=t.dataset.view;render();
});
document.querySelectorAll('.src').forEach(c=>c.onchange=render);

// Initial paint. This is a pure read (?poll=1) — opening the page starts no work.
load();
</script>
</body>
